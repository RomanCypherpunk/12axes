spring.application.name=12axes-backend
server.port=${PORT:8080}

app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://12axes.vercel.app,https://12axes.enzoxavier.com.br}

# Bloqueio de /api/** por Origin. Desligar pelo painel do Render se algo quebrar.
app.origin-enforcement=${API_ORIGIN_ENFORCEMENT:true}

# Alem do Origin, exige User-Agent e Sec-Fetch-Site (todo navegador moderno manda; cliente de
# servidor comum nao). Desligado por padrao para nao barrar Safari antigo, webviews in-app ou extensoes.
app.require-fetch-metadata=${API_REQUIRE_FETCH_METADATA:false}

# Registra 1 em cada N acessos aceitos (IP, User-Agent, Origin, Sec-Fetch-*) para auditar quem passa. 0 desliga.
app.access-sample-every=${API_ACCESS_SAMPLE_EVERY:200}

# Limite por IP e por minuto. Resultados sao pesados (ranking de todo o catalogo), por isso o limite menor.
app.rate-limit.enabled=${API_RATE_LIMIT_ENABLED:true}
app.rate-limit.heavy-per-minute=${API_RATE_LIMIT_HEAVY_PER_MINUTE:60}
app.rate-limit.general-per-minute=${API_RATE_LIMIT_GENERAL_PER_MINUTE:240}

# Banda do Render: JSON comprimido com gzip (4-5x menor).
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Relatorio pago. Desligado por padrao: sem PAYMENTS_ENABLED o endpoint responde 404.
app.payments.enabled=${PAYMENTS_ENABLED:false}
app.payments.entitlement-secret=${ENTITLEMENT_SECRET:}
# Chave secreta da Stripe: sk_test_... em teste, sk_live_... so no go-live. Nunca no repositorio.
app.payments.stripe-secret-key=${STRIPE_SECRET_KEY:}
# Um preco por moeda, criados no painel da Stripe. O preco nunca vem do navegador. Sem o ID, a moeda nao e vendida.
app.payments.price-id-brl=${STRIPE_PRICE_ID_BRL:}
app.payments.price-id-usd=${STRIPE_PRICE_ID_USD:}
# Quanto tempo o token vale (o reembolso de 7 dias e conferido na Stripe, nao aqui).
app.payments.token-valid-days=${ENTITLEMENT_VALID_DAYS:365}

# SO PARA DESENVOLVIMENTO LOCAL: abre o relatorio pago, sem pagamento, para chamadas da propria maquina (loopback).
# Nunca definir no Render.
app.premium.dev-open=${PREMIUM_DEV_OPEN:false}
