services:
  - type: web
    name: 12axes-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://12axes.vercel.app,https://12axes.enzoxavier.com.br
      - key: API_ORIGIN_ENFORCEMENT
        value: "true"
